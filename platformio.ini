; GreatScan 3.5 Interface and Gauges
; ESP32-S3 display + touch + Wi-Fi gauge cluster (homemade ScanGauge3-style unit for Ford Ranger PX2)
[platformio]
default_envs = esp32-s3-ui

[env:esp32-s3-ui]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_port = COM9
upload_port = COM9
test_port = COM9
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<*> -<scanner/>

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=1
  -DTFT_MISO=2
  -DTFT_SCLK=5
  -DTFT_CS=-1
  -DTFT_DC=3
  -DTFT_RST=-1
  -DTFT_BL=6
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DSPI_FREQUENCY=16000000
  -DSPI_READ_FREQUENCY=6000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  moononournation/GFX Library for Arduino @ 1.5.7

[env:esp32-can-x2]
platform = espressif32
framework = arduino

; Autosport Labs ESP32-CAN-X2 uses an ESP32-S3-WROOM-1-N8R8.
; Keep the compatible Espressif board definition here unless a dedicated
; PlatformIO board profile is added later.
board = esp32-s3-devkitc-1

monitor_speed = 115200
monitor_port = COM8
upload_port = COM8
test_port = COM8

build_src_filter = +<*> -<app/> -<ui/> -<net/> -<comm/> -<telemetry/> -<main.cpp>

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Isrc/scanner
  -Isrc/scanner/Core
  -Isrc/scanner/CAN
  -Isrc/scanner/Display
  -Isrc/scanner/Network
  -Ilib/Core/src
  -Ilib/Vehicle/src

lib_deps =
  autowp/autowp-mcp2515
  moononournation/GFX Library for Arduino @ 1.5.7
  lvgl/lvgl @ ^8.3.11

[env:native]
platform = native
test_build_src = no
build_src_filter = -<*>
